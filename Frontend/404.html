<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="favicon.png">

    <title>Page Not Found – Word to PDF Converter</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
            color: #222;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 20px;
        }

        .error-box {
            background-color: white;
            padding: 50px 40px;
            border-radius: 12px;

            max-width: 550px;
            width: 100%;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .error-icon {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;

            margin-bottom: 20px;
        }

        h1 {
            font-size: 70px;
            color: #2563eb;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 12px;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .home-button {
            display: inline-block;

            background-color: #2563eb;
            color: white;

            text-decoration: none;

            padding: 12px 25px;
            border-radius: 6px;

            font-size: 15px;
            font-weight: bold;

            transition: 0.3s;
        }

        .home-button:hover {
            background-color: #1d4ed8;
        }

        @media (max-width: 600px) {

            .error-box {
                padding: 40px 25px;
            }

            h1 {
                font-size: 55px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="error-box">

        <img
            src="favicon.png"
            alt="Word to PDF"
            class="error-icon"
        >

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>
            Sorry, the page you are looking for does not exist.
        </p>

        <a href="/" class="home-button">
            Back to Home
        </a>

    </div>

</body>

</html>
